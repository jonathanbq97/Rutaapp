<ion-content [fullscreen]="true">
  <div class="welcome">
    <div class="glass-frame">
      <h1>Ruta<span>App</span></h1>
      <p class="tagline">Tu viaje, a un toque</p>
      <div class="divider"></div>
      <p class="sub">Pide, sigue y paga tu viaje.<br />Todo en una sola app.</p>

      <img class="hero" src="assets/img/sedan.png" alt="" />
       
      <ion-button expand="block" (click)="start()">Empezar →</ion-button>
      <p class="login-link">
        ¿Ya tienes cuenta? <a (click)="login()">Inicia sesión</a>
      </p>
    </div>
  </div>
</ion-content>
